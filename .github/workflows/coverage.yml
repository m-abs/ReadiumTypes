name: coverage
on:
  push:
  issue_comment:
    types: [created]
jobs:
  coverage:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      (github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/coverage') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        id: pr
        if: github.event_name == 'issue_comment'
        with:
          script: core.setOutput('ref', `refs/pull/${context.issue.number}/head`)
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.ref || github.ref }}
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/ReadiumTypes.Tests -v q --nologo /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:CoverletOutput=coverage/ | tee coverage-summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: tests/ReadiumTypes.Tests/coverage/
      - uses: actions/github-script@v7
        if: github.event_name == 'issue_comment'
        with:
          script: |
            const fs = require('fs');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Coverage (run by @' + context.actor + '):\n```\n' + fs.readFileSync('coverage-summary.txt', 'utf8').trim() + '\n```\nHTML report: see the `coverage-report` artifact for this run.'
            });
